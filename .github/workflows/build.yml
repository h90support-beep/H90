name: Build H90 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        
        sudo mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        sudo unzip -q cmdline-tools.zip
        sudo mv cmdline-tools latest
        
        yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Create www folder
      run: |
        mkdir -p www
        cp index.html www/ 2>/dev/null || true
        cp style.css www/ 2>/dev/null || true
        cp script.js www/ 2>/dev/null || true
        cp player.js www/ 2>/dev/null || true
        cp channels.js www/ 2>/dev/null || true
        cp manifest.json www/ 2>/dev/null || true
        cp service-worker.js www/ 2>/dev/null || true
        cp H90.jpg www/ 2>/dev/null || true
        cp H90.png www/ 2>/dev/null || true
        ls -la www/

    - name: Create package.json
      run: |
        cat > package.json << 'EOF'
        {
          "name": "h90",
          "version": "1.0.0",
          "dependencies": {
            "@capacitor/core": "^6.0.0",
            "@capacitor/android": "^6.0.0",
            "@capacitor/app-launcher": "^6.0.0"
          },
          "devDependencies": {
            "@capacitor/cli": "^6.0.0"
          }
        }
        EOF

    - name: Create capacitor config
      run: |
        cat > capacitor.config.json << 'EOF'
        {
          "appId": "com.h90.app",
          "appName": "H90",
          "webDir": "www",
          "server": { "androidScheme": "https" },
          "android": { "allowMixedContent": true }
        }
        EOF

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/app-launcher

    - name: Add Android platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Add Queries to AndroidManifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if ! grep -q "org.videolan.vlc" $MANIFEST; then
          sed -i 's|</manifest>|<queries><package android:name="org.videolan.vlc" /></queries></manifest>|' $MANIFEST
        fi
        echo "=== AndroidManifest.xml queries ==="
        grep -A2 queries $MANIFEST || true

    - name: Generate app icons
      run: |
        mkdir -p resources
        cp H90.png resources/icon.png
        cp H90.png resources/splash.png
        npm install -D @capacitor/assets
        npx @capacitor/assets generate --android --iconBackgroundColor '#e53935' --iconBackgroundColorDark '#7B0F1E' --splashBackgroundColor '#7B0F1E' || true

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cat android/local.properties

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: H90-APK
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
