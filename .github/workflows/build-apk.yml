# ═══════════════════════════════════════════════════════════
# H90 App — Build Android APK (GitHub Actions)
# ═══════════════════════════════════════════════════════════

name: Build H90 APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build:
    name: 🔨 Build H90 APK
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ─── 2. Setup Node.js ───
      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ─── 3. Setup Java ───
      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ─── 4. Setup Android SDK ───
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─── 5. Cache Gradle ───
      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─── 6. Install Dependencies ───
      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      # ─── 7. Capacitor Sync ───
      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      # ─── 8. Verify Icon ───
      - name: 🖼️ Verify Icon
        run: |
          if [ -f "www/H90.jpg" ]; then
            echo "✅ H90.jpg found"
          else
            echo "⚠️ H90.jpg NOT found"
          fi

      # ─── 9. Build Debug APK ───
      - name: 🔨 Build Debug APK
        if: github.event.inputs.build_type != 'release'
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # ─── 10. Build Release APK ───
      - name: 🔨 Build Release APK
        if: github.event.inputs.build_type == 'release'
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      # ─── 11. Find APK ───
      - name: 🔍 Locate APK Files
        id: find-apk
        run: |
          echo "🔍 Searching for APK..."

          DEBUG_APK=$(find android -path "*debug*.apk" -type f 2>/dev/null | head -n 1)
          RELEASE_APK=$(find android -path "*release*.apk" -type f 2>/dev/null | head -n 1)

          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "debug_apk=$DEBUG_APK" >> $GITHUB_OUTPUT
            echo "✅ Debug APK: $DEBUG_APK"
          fi

          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "release_apk=$RELEASE_APK" >> $GITHUB_OUTPUT
            echo "✅ Release APK: $RELEASE_APK"
          fi

      # ─── 12. Upload Debug APK ───
      - name: 📤 Upload Debug APK
        if: steps.find-apk.outputs.debug_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: H90-Debug-APK
          path: ${{ steps.find-apk.outputs.debug_apk }}
          retention-days: 30

      # ─── 13. Upload Release APK ───
      - name: 📤 Upload Release APK
        if: steps.find-apk.outputs.release_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: H90-Release-APK
          path: ${{ steps.find-apk.outputs.release_apk }}
          retention-days: 30

      # ─── 14. Summary ───
      - name: 📊 Build Summary
        run: |
          echo "## 🎬 H90 APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY

          if [ -f "${{ steps.find-apk.outputs.debug_apk }}" ]; then
            SIZE=$(du -h "${{ steps.find-apk.outputs.debug_apk }}" | cut -f1)
            echo "- ✅ **Debug APK**: \`$SIZE\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "${{ steps.find-apk.outputs.release_apk }}" ]; then
            SIZE=$(du -h "${{ steps.find-apk.outputs.release_apk }}" | cut -f1)
            echo "- ✅ **Release APK**: \`$SIZE\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Installation" >> $GITHUB_STEP_SUMMARY
          echo "1. Download APK from Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Enable Unknown Sources" >> $GITHUB_STEP_SUMMARY
          echo "3. Install APK" >> $GITHUB_STEP_SUMMARY